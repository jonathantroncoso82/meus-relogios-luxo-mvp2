services:
  db:
    image: postgres:15-alpine
    container_name: luxwatch_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-luxwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-luxwatch_secret}
      POSTGRES_DB: ${POSTGRES_DB:-luxwatch_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - luxwatch_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-luxwatch} -d ${POSTGRES_DB:-luxwatch_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: luxwatch_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-luxwatch}:${POSTGRES_PASSWORD:-luxwatch_secret}@db:5432/${POSTGRES_DB:-luxwatch_db}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_change_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - luxwatch_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:4000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: luxwatch_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - luxwatch_net

volumes:
  postgres_data:

networks:
  luxwatch_net:
    driver: bridge
