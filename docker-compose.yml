services:
  db:
    image: postgres:15-alpine
    container_name: relogios_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-relogios_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-relogios_pass}
      POSTGRES_DB: ${DB_NAME:-relogios_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - relogios_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-relogios_user} -d ${DB_NAME:-relogios_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: relogios_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-relogios_user}:${DB_PASSWORD:-relogios_pass}@db:5432/${DB_NAME:-relogios_db}
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkey_change_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - relogios_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: relogios_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - relogios_net

volumes:
  postgres_data:

networks:
  relogios_net:
    driver: bridge
